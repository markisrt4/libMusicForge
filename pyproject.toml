[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libmusicforge"
version = "0.1.0"
description = "Provider-agnostic music metadata and discovery library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "libMusicForge contributors"}]
keywords = ["music", "metadata", "musicbrainz", "analytics"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
analysis = ["numpy>=1.26"]
dev = ["pytest>=8"]
quality = ["ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/musicforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/musicforge"]
