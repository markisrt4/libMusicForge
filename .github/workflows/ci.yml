name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
      - name: Check interface documentation
        run: python scripts/check_interface_docstrings.py
      - name: Build Doxygen documentation
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[analysis,dev]"
      - name: Unit tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and quality tools
        run: python -m pip install -e ".[analysis,dev,quality]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy
      - name: Build distributions
        run: python -m build
